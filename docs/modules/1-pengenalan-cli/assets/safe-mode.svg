<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Alur Safe Mode: perubahan dibatalkan otomatis jika koneksi terputus, atau disimpan jika CTRL+X ditekan lagi">
  <style>
    .step  { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .okbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; }
    .badbox{ fill: #ffebe9; stroke: #cf222e; stroke-width: 2; }
    .hd    { font: 600 18px sans-serif; fill: #24292f; }
    .t     { font: 16px sans-serif; fill: #24292f; }
    .mut   { font: 15px sans-serif; fill: #57606a; }
    .mono  { font: 600 16px ui-monospace, monospace; fill: #24292f; }
    .arr   { stroke: #57606a; stroke-width: 2.5; fill: none; }
    .okarr { stroke: #1a7f37; stroke-width: 2.5; fill: none; }
    .badarr{ stroke: #cf222e; stroke-width: 2.5; fill: none; }
    .oklb  { font: 600 15px sans-serif; fill: #1a7f37; }
    .badlb { font: 600 15px sans-serif; fill: #cf222e; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>

  <!-- langkah 1 -->
  <rect class="step" x="16" y="112" width="180" height="86" rx="8"/>
  <text class="mono" x="106" y="146" text-anchor="middle">CTRL + X</text>
  <text class="mut"  x="106" y="170" text-anchor="middle">prompt berubah</text>
  <text class="mono" x="106" y="190" text-anchor="middle" style="font-size:15px">&lt;SAFE&gt;</text>

  <path class="arr" d="M196,155 H252" marker-end="url(#a)"/>

  <!-- langkah 2 -->
  <rect class="step" x="258" y="112" width="196" height="86" rx="8"/>
  <text class="t"   x="356" y="146" text-anchor="middle">Ubah konfigurasi</text>
  <text class="mut" x="356" y="170" text-anchor="middle">misalnya IP address</text>
  <text class="mut" x="356" y="190" text-anchor="middle">atau rute</text>

  <!-- cabang atas: aman -->
  <path class="okarr" d="M454,140 H512 Q532,140 532,118 V92" marker-end="url(#ao)"/>
  <rect class="okbox" x="392" y="16" width="352" height="66" rx="8"/>
  <text class="oklb" x="412" y="42">Konfigurasi benar</text>
  <text class="mut"  x="412" y="66">Tekan <tspan class="mono" style="font-size:15px">CTRL + X</tspan> lagi untuk menyimpan.</text>

  <!-- cabang bawah: gagal -->
  <path class="badarr" d="M454,172 H512 Q532,172 532,196 V222" marker-end="url(#ab)"/>
  <rect class="badbox" x="392" y="228" width="352" height="96" rx="8"/>
  <text class="badlb" x="412" y="254">Koneksi terputus</text>
  <text class="mut"   x="412" y="278">Router menunggu beberapa saat, lalu</text>
  <text class="mut"   x="412" y="300">membatalkan sendiri seluruh perubahan</text>
  <text class="mut"   x="412" y="318">dan kembali ke kondisi terakhir yang aman.</text>

  <text class="hd" x="16" y="42">Safe Mode</text>
  <text class="mut" x="16" y="66" style="font-size:15px">Pengaman saat</text>
  <text class="mut" x="16" y="86" style="font-size:15px">mengubah router dari</text>
  <text class="mut" x="16" y="106" style="font-size:15px">jarak jauh.</text>
</svg>
