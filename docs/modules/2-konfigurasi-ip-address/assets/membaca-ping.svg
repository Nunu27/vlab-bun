<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Peta hasil ping: setiap pesan menunjuk ke titik masalah yang berbeda">
  <style>
    .box   { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .name  { font: 600 18px sans-serif; fill: #24292f; }
    .link  { stroke: #8c959f; stroke-width: 2; }
    .mono  { font: 15px ui-monospace, monospace; fill: #24292f; }
    .mut   { font: 15px sans-serif; fill: #57606a; }
    .hd    { font: 600 18px sans-serif; fill: #24292f; }
    .badlb { font: 600 15px sans-serif; fill: #cf222e; }
    .oklb  { font: 600 15px sans-serif; fill: #1a7f37; }
    .lead  { stroke: #cf222e; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .leadok{ stroke: #1a7f37; stroke-width: 2; fill: none; }
  </style>

  <text class="hd" x="20" y="28">Pesan yang muncul menunjukkan di mana letak masalahnya</text>

  <!-- jalur -->
  <rect class="box" x="20"  y="72" width="150" height="58" rx="7"/>
  <text class="name" x="95" y="107" text-anchor="middle">Pengirim</text>

  <rect class="box" x="305" y="72" width="150" height="58" rx="7"/>
  <text class="name" x="380" y="107" text-anchor="middle">Segmen lokal</text>

  <rect class="box" x="590" y="72" width="150" height="58" rx="7"/>
  <text class="name" x="665" y="107" text-anchor="middle">Tujuan</text>

  <path class="link" d="M170,101 H305"/>
  <path class="link" d="M455,101 H590"/>

  <!-- 1: network is unreachable -->
  <path class="lead" d="M95,130 V166"/>
  <text class="mono" x="20" y="192" style="fill:#cf222e; font-weight:600">Network is unreachable</text>
  <text class="mut"  x="20" y="214">Pengirim sendiri tidak tahu</text>
  <text class="mut"  x="20" y="234">harus lewat mana. Belum ada</text>
  <text class="mut"  x="20" y="254">rute atau default gateway.</text>
  <text class="badlb" x="20" y="278">Masalah di sisi pengirim.</text>

  <!-- 2: destination host unreachable -->
  <path class="lead" d="M380,130 V166"/>
  <text class="mono" x="270" y="192" style="fill:#cf222e; font-weight:600">Destination Host</text>
  <text class="mono" x="270" y="212" style="fill:#cf222e; font-weight:600">Unreachable</text>
  <text class="mut"  x="270" y="234">Tujuan ada di segmen lokal</text>
  <text class="mut"  x="270" y="254">yang sama, tetapi tidak</text>
  <text class="mut"  x="270" y="274">menjawab permintaan ARP.</text>
  <text class="badlb" x="270" y="298">Perangkat mati, kabel lepas,</text>
  <text class="badlb" x="270" y="318">atau alamatnya salah ketik.</text>

  <!-- 3: 100% packet loss -->
  <path class="lead" d="M665,130 V166"/>
  <text class="mono" x="740" y="192" text-anchor="end" style="fill:#cf222e; font-weight:600">100% packet loss</text>
  <text class="mut"  x="740" y="214" text-anchor="end">Paket terkirim, tetapi tidak</text>
  <text class="mut"  x="740" y="234" text-anchor="end">ada jawaban sama sekali.</text>
  <text class="badlb" x="740" y="258" text-anchor="end">Tujuan belum dikonfigurasi,</text>
  <text class="badlb" x="740" y="278" text-anchor="end">interface masih down, ICMP</text>
  <text class="badlb" x="740" y="298" text-anchor="end">diblokir, atau rute balik</text>
  <text class="badlb" x="740" y="318" text-anchor="end">belum ada.</text>

  <!-- berhasil -->
  <rect x="20" y="342" width="720" height="46" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text class="mono" x="40" y="371" style="fill:#1a7f37; font-weight:600">64 bytes from ... time=0.4 ms</text>
  <text class="mut"  x="350" y="371">Jalur sudah benar dari ujung ke ujung.</text>
</svg>
